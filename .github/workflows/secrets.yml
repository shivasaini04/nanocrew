name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks with checksum verification
        env:
          VERSION: 8.30.1
        run: |
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl --fail --location --retry 3 -o checksums.txt "$BASE/gitleaks_${VERSION}_checksums.txt"
          grep " ${ARCHIVE}$" checksums.txt | sha256sum --check -
          tar -xzf "$ARCHIVE" gitleaks
      - name: Scan the complete history
        run: ./gitleaks git . --redact --log-opts="--all" --no-banner

name: Docker quickstart

# Follows the README quickstart on a clean Linux runner: build the agent image, build the
# orchestrator, `docker compose up`, then check the app answers. Slow (builds a browser
# image), so it runs on pushes that touch the container setup, and on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'Dockerfile.orchestrator'
      - 'docker-compose.yml'
      - 'litellm_config.yaml'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'

      - name: Build the agent image
        run: bash container/build.sh

      - name: Agent image can import its own code
        run: docker run --rm --entrypoint python nanocrew-agent:latest -c "import nanoagent; print('nanoagent import ok')"

      - name: Audit installed Python runtime dependencies
        run: |
          docker run --rm --entrypoint python nanocrew-agent:latest -m pip freeze --exclude nanoagent-ai > image-requirements.txt
          uv tool run pip-audit --disable-pip --no-deps -r image-requirements.txt

      - name: Image processing and approval regression tests
        run: |
          docker run --rm --user 0:0 -v "$PWD/container/nanoagent/tests:/app/nanoagent/tests:ro" --entrypoint sh nanocrew-agent:latest -c 'python -m pip install --quiet "pytest>=9,<10" "pytest-asyncio>=1.3,<2" && python -m pytest -q -o cache_dir=/tmp/pytest-cache /app/nanoagent/tests/test_effector_stage61_pixel_elements.py /app/nanoagent/tests/test_effector_phase8_vision_and_danger_gate.py'

      - name: Agent image can make an LLM call (local stand-in, no key)
        # --user 0:0 as the orchestrator starts agent containers (Docker-out-of-Docker).
        run: docker run --rm --user 0:0 -v "$PWD/container/llm-smoke.py:/smoke.py:ro" --entrypoint python nanocrew-agent:latest /smoke.py

      - name: Build the orchestrator
        run: npm ci && npm run build

      - name: Configure .env (one dummy key, as a new user would add a real one)
        run: |
          cp .env.example .env
          sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=sk-ant-dummy-for-ci|" .env
          sed -i "s|^HOST_PROJECT_ROOT=.*|HOST_PROJECT_ROOT=$GITHUB_WORKSPACE|" .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^SESSION_ENCRYPTION_KEY=.*|SESSION_ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ci-admin-password-1234|" .env

      - name: docker compose up
        run: docker compose up -d --build

      - name: Wait for the app to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3002/health >/dev/null; then echo "orchestrator healthy after ${i}x5s"; exit 0; fi
            sleep 5
          done
          echo "orchestrator did not become healthy"; exit 1

      - name: Dashboard is served
        run: curl -fsS http://localhost:3002/ | grep -qi "<div id=\"root\"\|<html"

      - name: Logs on failure
        if: failure() && hashFiles('.env') != ''
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always() && hashFiles('.env') != ''
        run: docker compose down -v

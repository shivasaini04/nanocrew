name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - name: Audit the locked Python runtime dependencies
        working-directory: container/nanoagent
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
          uv tool run pip-audit --disable-pip --require-hashes -r requirements-audit.txt

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Orchestrator build
        run: npm run build

      - name: Dashboard dependencies
        run: cd dashboard && npm ci

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          cd dashboard && npm audit --omit=dev --audit-level=high

      - name: Tests
        run: npx vitest run

      - name: Dashboard build
        run: cd dashboard && npm run build

      - name: Optional channel components
        run: |
          npm ci --prefix container/agent-runner
          npm run build --prefix container/agent-runner
          npm audit --prefix container/agent-runner --omit=dev --audit-level=high
          npm ci --prefix container/nanoagent/bridge
          npm run build --prefix container/nanoagent/bridge
          npm audit --prefix container/nanoagent/bridge --omit=dev --audit-level=high
          npm audit --prefix companion --omit=dev --audit-level=high
